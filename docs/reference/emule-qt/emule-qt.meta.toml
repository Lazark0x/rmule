reason = "Source of the Stimulus Counterparty of ADR-0082: the headless emulecored daemon that gives rmule a third body on the wire for parity rows blocked by a two-node artefact. Its source is read for facts about its own behaviour and for its protocol specification documents; its bytes never score a parity row."
fetch_status = "ok"
notes = "Read-for-facts only, and unlike the eMule Reference Source it may not inform derived logic at all: 672 of 677 classifiable files under src/ carry no licence header, and the only governing declaration is repo-level bare \"GPL-2.0\" with no \"or later\" grant stated anywhere. The or-later argument that makes the eMule tree legally derivable is absent here. The tree also vendors srchybrid/ — the eMule MFC source — which is registered separately at docs/reference/emule-source/ and pinned upstream instead; do not read it from this clone. Carries two substantial rmule-authored-interest specs under docs/protocol/: ipv6-spec.md (the NeoMule-lineage IPv6 extension family, which rmule adopted) and http-cache-spec.md (ruled out of scope). See LICENSE.md."
