notes = "Pinned by commit SHA rather than by the eMule_v0.70b-community tag: git objects are content-addressed so the SHA is the integrity check, and tags are mutable. No sha256 field — that applies to kind=\"file\" sources only. Verified 2026-09-11 to be byte-for-byte identical to the srchybrid/ tree vendored inside ModderMule/emule-qt (all 922 common files), which is how it was found. Per-file headers carry the eMule devteam grant 'either version 2 of the License, or (at your option) any later version', making the tree GPL-2-or-later and compatible with rmule's GPL-3-or-later; ADR-0004's no-porting rule still applies and is a discipline choice, not a licence constraint. Contains third-party code under other terms: RSA Data Security MD4/MD5 reference notices, Brian Gladman's permissive-or-GPL SHA, Shareaza-copyrighted files, and informal CodeProject-era MFC helpers. See LICENSE.md."
