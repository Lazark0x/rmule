notes = "Fork Pin, ADR-0045 as amended 2026-09-16: owner `kno`, branch `integration/network-parity`, commit `ab483654f3c975face368184912138513184e3f0` (2026-09-10, \"fix(merge): adapt network parity to peer endpoint API\"), upstream base `amule-org/amule` merge-base `1cbc7c50f39e1e940d4dc0257169633f00a71435` (ahead 117, behind 70 as measured 2026-09-16). Admissible because the commit is real and rmule did not author it; downgraded to Stimulus the moment it can no longer be rebuilt, which is why the image recipe rebuilds from this clone rather than pulling a published tag. Pieces 1/2/3, the vendored libutp and the uTP inbound acceptor are merged upstream; IPv6 activation, NAT-T rendezvous and QUIC are fork-only. The author states QUIC has never completed a connection with another implementation and that NAT-T answers but does not initiate."
