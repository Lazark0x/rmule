reason = "The **Fork Pin** counterparty of ADR-0092: the only body carrying IPv6 dual-stack activation, the Kad `0x0a` tags, the uTP transport and the eMuleAI NAT-T rendezvous at once, and therefore the counterparty for the IPv6-dialect and NAT-traversal harness rows. Built into the `amule-kno` interop image; its bytes are evidence, its source is read only to explain them."
