reason = "The author of the eMuleAI NAT-T dialect ADR-0091 adopts: the uTP/QUIC connect-option bits, OP_RENDEZVOUS/OP_HOLEPUNCH and the `ip6`/`bi6` Kad source tags. Read to settle questions the research behind ADR-0091 left open about which surfaces those bits actually reach — for example whether a Kad source row's TAG_ENCRYPTION carries a NAT-T bit, which only this tree answers. Never admissible as parity evidence per ADR-0045; its bytes are evidence only when captured from a running build."
fetch_status = "ok"
notes = "Pinned by SHA (the commit that research read, 2026-07-25 \"Cumulative v1.6 update\"). The finding that motivated caching it: eMuleAI's Kad publish routes TAG_ENCRYPTION through the *global* `::GetMyConnectOptions` (`srchybrid/OtherFunctions.cpp`, reached via `srchybrid/kademlia/kademlia/Prefs.cpp` `CPrefs::GetMyConnectOptions`), so a Kad source row from an eMuleAI publisher carries CONNECT_OPT_NAT_TRAVERSAL_UTP (0x80) and _QUIC (0x40) — while eMule 0.70b and aMule use the Kad-local assembly that stops at 0x08. eMuleAI also renames TAG_BUDDYHASH to TAG_SERVINGBUDDYHASH (same byte 0xF8) and encodes it from `CUInt128::GetData()` rather than aMule's `ToByteArray()`, a per-word byte swap apart."
