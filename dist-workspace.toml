[workspace]
members = ["cargo:."]

# Config for 'dist'. Regenerate .github/workflows/release.yml with
# `dist generate` after changing anything here; CI fails on a stale copy.
[dist]
# The dist version the release workflow installs.
cargo-dist-version = "0.33.0"
ci = "github"
hosting = "github"
# Shell and PowerShell installers. `rmule` (the terminal client) and
# `rmule-cli` are the only shipped packages, each named for its binary; the
# other binary crates opt out in their own manifests.
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# One checksum file per archive, plus the unified sha256.sum for the release.
checksum = "sha256"
unix-archive = ".tar.gz"
windows-archive = ".zip"
# Every archive carries the licence, the readme and the third-party notices.
# THIRD-PARTY-LICENSES.md is generated, not committed: the build setup step
# creates it before the build, and a missing file fails the build.
auto-includes = false
include = ["LICENSE", "README.md", "THIRD-PARTY-LICENSES.md"]
github-build-setup = "../build-setup.yml"
# Scripts put the binaries in ~/.local/bin, not in a Rust toolchain's bin.
install-path = "~/.local/bin"
install-updater = false
# Build `-p rmule` and `-p rmule-cli`, not `--workspace`: the developer
# tools in the workspace are not released and need not build on every target.
precise-builds = true

# The Linux builds run natively, each on a runner of its own architecture, so
# the C dependencies (ring) are compiled by the platform's own toolchain. The
# 22.04 images keep the glibc floor at 2.35.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"

# The generated release workflow uses these actions at the commits below
# instead of floating tags. Bump a pin together with its tag comment, then run
# `dist generate`.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
