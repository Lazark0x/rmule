[package]
name = "rmule"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# `publish = false` hides a binary crate from dist; this ships it anyway.
[package.metadata.dist]
dist = true

# The product front door (ADR-0069): `rmule` is the UI app with the embedded
# core, mirroring aMule's naming; `rmuled` stays reserved for the daemon era.
# The package carries the binary's name, so the dist artifacts are `rmule-*`
# and `cargo install --git <repo> rmule` installs it.
[[bin]]
name = "rmule"
path = "src/main.rs"

[dependencies]
# Wall-clock stamps in the Networks log gutter (local time at draw); the
# state layer stays on injected `Instant`s.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OSC 52 clipboard payload (Copy eD2k link) is base64-encoded.
data-encoding.workspace = true
# NFD for the accent fold in a Table Sort's name comparison.
icu_normalizer.workspace = true
ratatui.workspace = true
# The server.met fetch capability core deliberately does not link (ADR-0080):
# `ReqwestFetcher` is injected at startup so *Update from URL* works, and
# `DEFAULT_SERVER_MET_URL` pre-fills its form.
rmule-bootstrap = { path = "../../crates/rmule-bootstrap", features = ["reqwest-fetcher"] }
rmule-core = { path = "../../crates/rmule-core" }
rmule-primitives = { path = "../../crates/rmule-primitives" }
thiserror.workspace = true
# `rt-multi-thread` on top of the workspace set: one multi-thread runtime for
# UI loop, bridge, and core tasks alike (ADR-0069 §Runtime).
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
# The Run Log (`run_log`): the file every `tracing` event of a run lands in.
tracing-subscriber.workspace = true

[dev-dependencies]
# The front-door leg runs the built `rmule` binary and asserts what it printed.
assert_cmd.workspace = true
predicates.workspace = true
# Test-only: building a v2 `nodes.dat` fixture for the Kad-join seed path
# needs the codec. The production dep graph stays Kad-free — the app
# talks to core, and core owns the Kad vocabulary.
rmule-kad = { path = "../../crates/rmule-kad" }
# Test-only: a Software cell is asserted against the identification a real
# hello yields, so the fixture builds that hello with the peer codec.
rmule-peer = { path = "../../crates/rmule-peer" }
# Test-only: the search-options end-to-end proof needs a counterparty
# that decodes `OP_SEARCHREQUEST` back into the query it states, so the
# constraint tree is asserted where it lands — on the server — not where it
# was built.
rmule-testkit = { path = "../../crates/rmule-testkit" }
tempfile.workspace = true
# `start_paused` + `time::advance` pace the bridge's data tick deterministically.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
