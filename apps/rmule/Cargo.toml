[package]
name = "rmule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# `publish = false` hides a binary crate from dist; this ships it anyway.
[package.metadata.dist]
dist = true

# The product front door (ADR-0069): `rmule` is the UI app with the embedded
# core, mirroring aMule's naming; `rmuled` stays reserved for the daemon era.
# The package carries the binary's name, so the dist artifacts are `rmule-*`
# and `cargo install --git <repo> rmule` installs it.
[[bin]]
name = "rmule"
path = "src/main.rs"

[dependencies]
parking_lot.workspace = true
# Wall-clock stamps in the Networks log gutter (local time at draw); the
# state layer stays on injected `Instant`s.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OSC 52 clipboard payload (Copy eD2k link) is base64-encoded.
data-encoding.workspace = true
ratatui.workspace = true
# Grapheme clusters: a caret moves over what a reader calls a character.
unicode-segmentation.workspace = true
unicode-width.workspace = true
# The server.met fetch capability core deliberately does not link (ADR-0080):
# `ReqwestFetcher` is injected at startup so *Update from URL* works, and
# `DEFAULT_SERVER_MET_URL` pre-fills its form.
rmule-bootstrap = { path = "../../crates/rmule-bootstrap", features = ["reqwest-fetcher"] }
rmule-core = { path = "../../crates/rmule-core" }
# Preview's Default App on macOS and Windows: the system's app for a
# file-name extension (ADR-0114); and the terminal's hang-up and job control
# (ADR-0118).
rmule-os = { path = "../../crates/rmule-os" }
rmule-primitives = { path = "../../crates/rmule-primitives" }
rmule-words = { path = "../../crates/rmule-words" }
# The Player Command splits into words by POSIX rules (ADR-0114).
shlex.workspace = true
thiserror.workspace = true
# `rt-multi-thread` on top of the workspace set: one multi-thread runtime for
# UI loop, bridge, and core tasks alike (ADR-0069 §Runtime). `process`: the
# player lane starts Preview's player and awaits its exit (ADR-0114). `signal`:
# job control's stop and continue (ADR-0118).
tokio = { workspace = true, features = ["rt-multi-thread", "process", "signal"] }
tracing.workspace = true

[dev-dependencies]
# The front-door leg runs the built `rmule` binary and asserts what it printed.
assert_cmd.workspace = true
predicates.workspace = true
# Test-only: building a v2 `nodes.dat` fixture for the Kad-join seed path
# needs the codec. The production dep graph stays Kad-free — the app
# talks to core, and core owns the Kad vocabulary.
rmule-kad = { path = "../../crates/rmule-kad" }
# Test-only: the search-options end-to-end proof needs a counterparty
# that decodes `OP_SEARCHREQUEST` back into the query it states, so the
# constraint tree is asserted where it lands — on the server — not where it
# was built. A Software cell is asserted against the client a real hello
# names, which the shared fixture builds with the peer codec.
rmule-testkit = { path = "../../crates/rmule-testkit" }
# A surface's layout test holds a sentence whatever its words.
rmule-words = { path = "../../crates/rmule-words", features = ["test-support"] }
tempfile.workspace = true
# Test-only: the bridge test reads the records a subscriber of its own receives.
tracing-subscriber.workspace = true
# `start_paused` + `time::advance` pace the bridge's data tick deterministically.
tokio = { workspace = true, features = ["test-util"] }

# The exits leg opens a real pty, whose closed master is the only way to lose
# a terminal. Already in the tree under `rmule-os`.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { workspace = true, features = ["pty"] }

[lints]
workspace = true
