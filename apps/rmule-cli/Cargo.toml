[package]
name = "rmule-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# `publish = false` hides a binary crate from dist; this ships it anyway.
[package.metadata.dist]
dist = true

[[bin]]
name = "rmule-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rmule-core = { path = "../../crates/rmule-core" }
rmule-kad = { path = "../../crates/rmule-kad" }
rmule-net = { path = "../../crates/rmule-net" }
# The open-descriptor limit the Connection Ceiling is held under (ADR-0116).
rmule-os = { path = "../../crates/rmule-os" }
rmule-primitives = { path = "../../crates/rmule-primitives" }
# The front ends' words for core's codes: the CLI says the Run Log's absence,
# a refused directory and a completed download as the TUI does.
rmule-words = { path = "../../crates/rmule-words" }
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
rmule-testkit = { path = "../../crates/rmule-testkit" }
tempfile.workspace = true

[lints]
workspace = true
