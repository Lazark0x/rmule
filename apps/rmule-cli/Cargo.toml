[package]
name = "rmule-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# `publish = false` hides a binary crate from dist; this ships it anyway.
[package.metadata.dist]
dist = true

[[bin]]
name = "rmule-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rmule-core = { path = "../../crates/rmule-core" }
rmule-kad = { path = "../../crates/rmule-kad" }
rmule-net = { path = "../../crates/rmule-net" }
rmule-primitives = { path = "../../crates/rmule-primitives" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
