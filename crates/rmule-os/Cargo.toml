[package]
name = "rmule-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

# `[workspace.lints]` repeated, but for one entry: this crate alone relaxes
# `unsafe_code` from `forbid` to `deny`, for the operating-system calls no safe
# wrapper offers. `scripts/guards.sh` (check `unsafe`) keeps every other line in
# step with the workspace table and pins the functions that may waive it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
