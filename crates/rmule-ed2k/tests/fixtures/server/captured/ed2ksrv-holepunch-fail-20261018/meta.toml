# The server-coordinated punch refused: a genuine `OP_LOWID_HOLEPUNCH_FAIL 0x62`
# the third-party eD2k index server `andrey23127/ed2k-server` (pin `4da4774`,
# v0.9.75) sent the asker of an `OP_LOWID_HOLEPUNCH_REQUEST 0x60` that named a
# Low ID no client held — ADR-0091's second Rendezvous coordinator saying no.
#
# Cut from the server's own tap (`holepunch-fail/server.pcap`, the server's
# namespace, TCP 4661) by TCP payload, one whole `0xE3` frame, never retyped:
# 11 bytes = 5-byte header + opcode + 5-byte body. Nothing is fabricated
# (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# The `0x62` decoder against a second implementation's bytes: the body layout
# `<target_id 4 LE><reason 1>` (the target reads `ba dc fe 00`, little-endian),
# that the refusal names the target the request asked for, and that reason `1`
# is "target not connected" — the one reason a later request can change.
# Reasons `2` (target is High ID), `3` (bad request) and `4` (target sent no
# UDP ports) were not drawn; they stay read from the server's source.
#
# Tier: **`single-oracle`** (ADR-0045 point 6). No other pinned body speaks the
# `0x60`/`0x61`/`0x62` coordinator dialect.

