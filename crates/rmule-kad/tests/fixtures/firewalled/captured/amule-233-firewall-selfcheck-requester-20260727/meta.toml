note    = "aMule's HELLO_RES answering rmule's 0x11 HELLO_REQ: KadID 55..55, TCP port 4662, Kad version 8. Version 8 (> 6) is what gates rmule's emission to the extended 0x53 rather than the legacy two-byte 0x50."

