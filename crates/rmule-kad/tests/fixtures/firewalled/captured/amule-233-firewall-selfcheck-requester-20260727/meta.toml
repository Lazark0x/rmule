layout  = "body 03 71 00 cb = rmule's observed external IP 203.0.113.3 as a little-endian WriteUInt32 (reversed dotted octets)"
note    = "aMule's genuine 0x58 answering rmule's 0x53: it echoes the requester's observed external IP. The body is the IP written LOW-OCTET-FIRST (aMule's WriteUInt32 / reversed dotted octets) — the SAME convention aMule uses for Kad contact IPs (rmule's messages.rs read_ipv4_low_octet_first / octets.reverse()). This capture proved rmule's 0x58 encode/decode used octets-in-order instead, a latent byte-order divergence fixed in the same change (reachability.rs)."

[frames.hello_res_0x19]
