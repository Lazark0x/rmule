# Kad's `ip6` tag (ADR-0087) off kno's aMule at its **Fork Pin** `ab483654`,
# both directions, captured on the IPv6 dialect bench during interop
# flow `ipv6-dialect ipv6-kad-tags`. Every `.bin` is one
# UDP payload lifted byte for byte off a tcpdump on **kno's own** attachment;
# nothing is fabricated (ADR-0045).
#
# ## What these frames are evidence FOR
#
# ADR-0087 names two oracles for the Kad `ip6`/`bi6` row and until now had
# neither captured. kno's fork is one of them, and these frames settle three
# sentences:
#
# 1. **kno writes `ip6`.** Its own source publish carries the address an
#    inbound IPv6 connection verified (`Search.cpp:886-902`, gated on
#    `MayAdvertiseIPv6()` and `GetVerifiedIPv6Address()`), as a 32-character
#    **upper-case** hex string (`CMD4Hash::Encode`). rmule wrote lower case (upper case now); the
#    reader is case-insensitive per the spec, and this frame is what proves the
#    two spellings meet.
# 2. **kno stores and re-serves ours.** A storer indexes every tag it does not
#    recognise verbatim (`KademliaUDPListener.cpp:1402`, "TODO: Filter tags"),
#    so the `0x3B` it answered rmule's search with carries rmule's `ip6` tag
#    byte-identical to the one rmule published, beside the tags kno authored
#    itself (`SOURCEIP` from the observed sender, `SOURCEUPORT` because the
#    publisher sent none).
# 3. **rmule reads both.** The publish decoder reads kno's row; the source-row
#    projection reads kno's answer into a High-ID Peer Source with the IPv6
#    endpoint beside it.
#
# `bi6` had no writer on this bench at this capture: kno's fork only reads it
# (`Search.cpp:1205`). rmule writes one now; kno's re-serve of it is
# `amule-kno-ab483654-kad-bi6-20260924/`.

