# Kad's `bi6` tag (ADR-0087) re-served by kno's aMule at its **Fork Pin**
# `ab483654`, captured on the IPv6 dialect bench during interop flow
# `ipv6-dialect ipv6-kad-tags`. Every `.bin` is
# one UDP payload lifted byte for byte off a tcpdump on **kno's own**
# attachment; nothing is fabricated (ADR-0045).
#
# ## What these frames are evidence FOR
#
# kno's fork writes no `bi6` (`Search.cpp:901` appends only `ip6`; the
# neighbouring `amule-kno-ab483654-kad-ip6-20260923/` has its own publish as the
# measured zero) and only reads it (`Search.cpp:1205-1224`). rmule now
# writes one: a firewalled publisher closes its type-3 buddy row with `bi6` =
# its buddy's IPv6, upper-case hex like `ip6`. These frames settle two
# sentences:
#
# 1. **kno stores and re-serves our `bi6`.** A storer indexes every tag it does
#    not recognise verbatim (`KademliaUDPListener.cpp:1402`), so the `0x3B` it
#    answered the firewalled publisher's search with carries rmule's `bi6` byte
#    for byte, case included, among the tags kno authored itself.
# 2. **aMule packs it.** The answer holds two rows (the firewalled row and the
#    direct publisher's row for the same file) and passes aMule's 200-byte line,
#    so it goes out as a packed `0xE5` datagram (zlib, 155 bytes on the wire,
#    268 inflated) — the first packed aMule-authored `0x3B` this tree keeps.
#    rmule's envelope decoder inflates it and the source-row projection reads
#    the `bi6` into the row's buddy contact, never into a direct IPv6 source.
#
# The first run of this flow (1790214948) lifted nothing here: its filter
# matched `0xE4` alone. Its fw publisher's own log had already decoded kno's
# packed answer, `bi6` included.

