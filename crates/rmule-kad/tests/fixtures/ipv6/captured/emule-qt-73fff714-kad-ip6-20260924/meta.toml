# Kad's `ip6` tag (ADR-0087) written by emule-qt `73fff714` in its own source
# publish, captured on the IPv6 dialect bench during interop flow
# `ipv6-dialect ipv6-kad-tags`. The `.bin` is one UDP
# payload lifted byte for byte off a tcpdump on the **rmule storer's**
# attachment (the storer at the file's key, which received it); nothing is
# fabricated (ADR-0045).
#
# ## What this frame is evidence FOR
#
# ADR-0087's amendment names emule-qt as the second `ip6` writer and the
# body the bench's IPv6 transfer is drawn from. This frame settles two sentences:
#
# 1. **emule-qt writes `ip6` in lower case.** `QByteArray::toHex`
#    (`KadSearch.cpp:1386-1391`) spells its interface address
#    `3fff0ed200010000000000000000000a`, where kno's fork writes upper case
#    (`amule-kno-ab483654-kad-ip6-20260923/`). The reader is case-insensitive
#    per the spec; this frame proves the lower-case spelling meets rmule's reader.
# 2. **rmule reads it.** The datagram is **obfuscated** to the storer's Kad ID
#    (emule-qt knows the ID from its `nodes.dat`), so the test decrypts it with
#    that ID, the storer's own receive path, and then decodes the plaintext
#    with the publish decoder: the `ip6` string becomes the row's IPv6.
#
# The same run's storer indexed this row, re-served it in its `0x3B`, and a
# rmule `Core` handed only emule-qt's link fetched the file over
# `[3fff:ed2:1::a]:4662`, byte-equal (ED2K E99CC2D540AF5C0E4C5E84A3E2C57BA8).

