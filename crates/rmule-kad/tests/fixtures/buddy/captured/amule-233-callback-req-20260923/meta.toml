# Genuine stock aMule 2.3.3 **`KADEMLIA_CALLBACK_REQ` (`0x52`) emit** — the
# datagram a downloading aMule sends to a Low-ID Kad source's buddy, found
# through a type-3 row. Captured on the fake-public Kad bench (Config A) during
# interop (flow M `kad-core-buddy --publish-source --amule-requester`).
# Every frame is bytes off a tcpdump on the bench;
# nothing is fabricated (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# Until this run every `0x52` rmule had pinned was rmule-authored (the downloader's and
# walker's): aMule had consumed and relayed them, but
# no aMule had ever *written* one. Here a second stock aMule (the requester),
# handed only the ed2k link, read Kad-open, searched the file, took the
# firewalled aMule's type-3 row from the rmule storer placed at the file key,
# built the Low-ID client (`DownloadQueue.cpp:1760-1776`, kno `ab483654`) and,
# with the source in `DS_WAITCALLBACK`, sent this datagram to the buddy the row
# named (`BaseClient.cpp:2133-2141`: logged `KadCallbackReq (size=34) to
# 203.0.113.3:4679`). The writer, field by field:
#
# * `buddyID` — `bio.WriteUInt128(CUInt128(GetBuddyID()))`. `GetBuddyID()` is
#   `pbuddyID->ToByteArray()`, `pbuddyID` the row's `TAG_BUDDYHASH` hex loaded
#   `SetValueBE` (`Search.cpp:1194-1202`), so the field is
#   `kad_wire_id(TAG_BUDDYHASH bytes)`: `CCDDEEFF…` in the row, `FFEEDDCC…` on
#   the wire — the buddy's own Kad ID in wire order. Never un-swapped by anyone.
# * `fileID` — `bio.WriteUInt128(CUInt128(m_reqfile->GetFileHash().GetHash()))`:
#   `kad_wire_id(file MD4)`, `009D9160…` → `60919D00…`.
# * `tcpPort` — `bio.WriteUInt16(thePrefs::GetPort())`, little-endian: 4662.
#
# Byte for byte this is the `0x52` rmule's own `LowIdRoad::BuddyCallback`
# wrote for the same file in run `1790161721` (`cmp` of the two lifted bodies is silent):
# the two writers agree.
#
# `storer_search_res_0x3b.bin` is the context — the `0x3B` the rmule storer
# answered the requester's `0x34` with (rmule-authored, aMule-consumed: aMule
# logged `Trying to add a source type 3` / `Happily adding a source
# (203.0.113.2:4662) type 3`). Its `TAG_BUDDYHASH` and `TAG_SERVERIP` /
# `TAG_SERVERPORT` are what the `0x52` answers to. The row itself was published
# by the firewalled aMule; the storer re-serialized it.

