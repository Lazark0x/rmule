# Genuine stock aMule 2.3.3 **`KADEMLIA_CALLBACK_REQ` (`0x52`) from the
# FINDSOURCE search** — aMule's second `0x52` writer, taken when a type-3 row
# names its buddy by `TAG_BUDDYHASH` but carries no `TAG_SERVERIP`/
# `TAG_SERVERPORT`. Captured on the fake-public Kad bench (Config A) during
# interop (flow M `kad-core-buddy --publish-source --amule-requester --omit-buddy-endpoint`).
# Every frame is bytes off a
# tcpdump on the bench; nothing is fabricated (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# `amule-233-callback-req-20260923` captured the `0x52` aMule writes
# with the buddy endpoint known (`BaseClient.cpp:2133-2141`, kno `ab483654`).
# With the endpoint absent `TryToConnect` takes the other branch
# (`BaseClient.cpp:2159-2175`): it logs `Searching buddy for lowid
# connection`, starts a `FINDSOURCE` search targeted at the row's buddy ID
# with the file hash as its one file ID, and the search sends the `0x52` to
# each responded contact within `SEARCHTOLERANCE` of that ID
# (`Search.cpp:1081-1122`). Nobody had captured aMule doing that.
#
# Here the stock requester read the ID-only row, logged the branch, sent a
# `KADEMLIA2_REQ` (`0x21`, `count=2` = `KADEMLIA_FIND_VALUE`) targeted at the
# buddy ID to the rmule buddy — the contact at distance 0 — took its `0x29`,
# and on the search's next jump-start (3 s of quiet) logged `Search request
# type: FindSource` / `KadCallbackReq to 203.0.113.3:4679` and wrote this
# datagram. Field by field it is the FINDSOURCE body (`Search.cpp:1092-1100`):
# `WriteUInt128(m_target)` (the buddy ID, `CUInt128(GetBuddyID())`),
# `WriteUInt128(m_fileIDs.front())` (the file hash), `WriteUInt16(GetPort())`.
#
# **Byte for byte it is that fixture's `0x52`** (`cmp` silent): same buddy ID in wire
# order `FFEEDDCC…`, same file ID `60919D00…`, same port 4662. The two aMule
# writers agree on every field spelling. It left plaintext `0xE4`: the Kad
# listener sends under the contact's key only with aMule's crypt layer
# supported, and this bench's aMule runs it off (flow M's plain-`0xE4` posture).
#
# ## Admissibility of the ID-only row (ADR-0045)
#
# No stock aMule writes a type-3 row without the buddy endpoint — its publisher
# always has it (`Search.cpp:840-855`) — and a patched aMule is not admissible.
# So the row's publisher is **rmule**: a `kad join-node` whose source publish
# names the rmule buddy by ID alone (`--publish-buddy-id`, rmule-kad's
# `SetBuddyPublish` writer with `buddy_udp: None`). The firewalled aMule shares
# nothing in this variant, so its own endpoint-carrying row never exists. The
# evidence — the `0x21` walk and the `0x52` — is the stock requester's.
#
# `storer_search_res_0x3b.bin` is the context: the rmule storer's `0x3B` with
# the one row (rmule-authored, aMule-consumed: `Trying to add a source type 3,
# ip 203.0.113.8:4672` / `Happily adding a source (203.0.113.8:4662) type 3`).
# Its tags: SOURCEIP, SOURCETYPE 3, SOURCEPORT 4662, SOURCEUPORT 4672,
# BUDDYHASH `CCDDEEFF8899AABB4455667700112233` — no SERVERIP, no SERVERPORT.
# `findsource_walk_req_0x21.bin` is the walk's request (aMule-authored).

