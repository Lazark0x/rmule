# Genuine stock aMule 2.3.3 **`KADEMLIA_CALLBACK_REQ` (`0x52`) from the
# FINDSOURCE search, keyed under aMule's Kad crypt** — the envelope bytes as
# they crossed the wire. Captured on the fake-public Kad bench (Config A)
# during interop (flow M `kad-core-buddy --publish-source
# --amule-requester --omit-buddy-endpoint --requester-kad-crypt`).
# Bytes off a tcpdump on the bench; nothing is fabricated (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# `amule-233-callback-req-findsource-20260923` captured aMule's FINDSOURCE
# `0x52` plaintext only because the bench
# runs aMule's crypt layer off. Here the requester alone runs it
# (`AMULE_KAD_CRYPT=1`: IsClientCryptLayerSupported/IsCryptLayerRequested on).
# The FINDSOURCE arm sends through `SendPacket(packetdata, KADEMLIA_CALLBACK_REQ,
# ip, port, from->GetUDPKey(), &clientID)` for a contact of version >= 6
# (`Search.cpp:1103-1110`, kno `ab483654`; the 2.3.3 build logs it as
# `Search.cpp(813)`), and `CMuleUDPSocket::SendPacket` encrypts whenever a crypt
# target ID is given and the layer is supported (`MuleUDPSocket.cpp:282-284`).
# So the datagram is keyed on **the buddy's Kad ID** — the key source is
# `from->GetClientID()`, the routing contact the walk answered from: the rmule
# buddy, Kad ID `ffeeddccbbaa99887766554433221100`, version 8. No verify key
# was needed: rmule's buddy runs without Kad crypt of its own, never handed the
# requester a key, and the trailer's receiver verify key reads 0.
#
# Decrypted under that Kad ID it is **byte for byte** that fixture's plaintext
# `callback_req_0x52.bin` (`cmp` silent): 36 bytes, the buddy ID, the file ID,
# port 4662. rmule's buddy decoded it live and relayed it (below).
#
# Envelope layout (52 bytes = 16 header/trailer + 36 payload): marker `0x20`
# (key family bits 00 = Kad ID), random key part `beaa`, then under RC4 the
# 4-byte sync word, pad length 0, receiver verify key `0x00000000`, sender
# verify key `0xb849ff6c`, payload.

