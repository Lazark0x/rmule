# Genuine kno aMule **`KADEMLIA_CALLBACK_REQ` (`0x52`) emit** at its **Fork
# Pin** `ab483654` — the datagram kno's download sent to a Low-ID Kad source's
# buddy after reading the type-3 row rmule's storer re-served **with `bi6`**.
# Captured on the IPv6 dialect bench during interop
# (`ipv6-dialect ipv6-kad-tags`, the kno-searches leg).
# Every `.bin` is one UDP payload lifted byte for byte off a tcpdump on kno's
# own attachment; nothing is fabricated (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# The neighbouring `amule-233-callback-req-*` fixtures are stock aMule 2.3.3's
# `0x52`. This one is kno's — the second aMule-lineage writer,
# and the first `0x52` any aMule wrote from a row carrying `bi6`. `cmp` against
# all four stock frames differs (different buddy, file and IDs); the layout is
# the same 34-byte payload, field for field (`BaseClient.cpp:2133-2160`):
#
# * `buddyID` — `kad_wire_id(TAG_BUDDYHASH)`: the row's `89ABCDEF…FEDCBA98`,
#   `EFCDAB89…98BADCFE` on the wire, which is the buddy contact rmule's reader
#   decodes from the same row.
# * `fileID` — `kad_wire_id(file MD4)`: `3F248BE5…` → `E58B243F…`, the key
#   kno's `0x34` searched and the storer's `0x3B` answered.
# * `tcpPort` — 4662, little-endian.
#
# And where it went: `45.55.200.8:4672`, the row's `TAG_SERVERIP` /
# `TAG_SERVERPORT`. kno validated the row's `bi6` and dropped it
# (`Search.cpp:1205-1224`; the log line is `AddDebugLogLineN`, compiled out of
# this Release image, `Logger.h:457-465`), built the type-3 source from the
# IPv4 trio alone (`Search.cpp:1231-1242`, `DownloadQueue.cpp:1761-1779`), and
# sent nothing to `3fff:ed2:1::8` over the whole run (0 packets on its tap).
#
# `storer_search_res_bi6_0x3b.bin` is the context and the rmule half: the
# `0x3B` the placed rmule storer answered kno's `0x34` with — rmule-authored,
# kno-consumed — the firewalled publisher's row re-served with its `bi6` last
# (ADR-0087's amendment). It is Stimulus, never evidence about kno.

