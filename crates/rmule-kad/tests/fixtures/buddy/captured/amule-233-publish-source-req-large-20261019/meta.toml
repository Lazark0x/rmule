# Genuine stock aMule 2.3.3 source publish for a file past 4 GiB: the `0x44
# KADEMLIA2_PUBLISH_SOURCE_REQ` a firewalled Kad node emitted for the
# 5,000,000,000-byte file it shares, while holding rmule as its recruited
# buddy. Captured on the fake-public Kad bench (Config A) during interop flow M
# `kad-core-buddy --publish-source`, with the file staged as one sparse hole
# (no 4 GiB on disk; the publisher hashed it as zeros). The frame is
# counterparty bytes lifted off a tcpdump on the counterparty's own network
# namespace; nothing is fabricated or edited (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# A file past `OLD_MAX_FILE_SIZE` (4,290,048,000 bytes, `Constants.h:77`) takes
# the large-file twin of each source type (`Search.cpp:587-633`): the
# firewalled buddy row is type 5 rather than 3 (`:613`), and `TAG_FILESIZE`
# rides as a `CTagVarInt`, which widens to `UINT64` above `0xFFFFFFFF`
# (`Tag.h:176-182`). Everything else is the type-3 row of
# `amule-233-publish-source-req-20260922`: the same tag order and widths, the
# same upper-case big-endian `TAG_BUDDYHASH`, no `TAG_SOURCEUPORT`, and
# `TAG_ENCRYPTION` last. eMule's spelling of this row stays source-derived: no
# body on the bench writes it.

