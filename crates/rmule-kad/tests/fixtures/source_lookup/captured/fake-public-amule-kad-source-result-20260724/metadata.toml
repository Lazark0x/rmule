status = "active"
provenance = "captured"
public_kad_used = false
reason = """
Genuine KADEMLIA2_PUBLISH_RES (0x4B) and KADEMLIA2_SEARCH_RES (0x3B) bytes from a
real STOCK aMule 2.3.3 storer, captured on the Config-A fake-public swarm
(RFC 5737 documentation range 203.0.113.0/24, Docker `internal` net — never
public). This is the capture-sweep successor to the
retired private-LAN-mesh capture `private-amule-kad-source-result-20260707`:
that one relied on FilterLanIPs=0 / LAN mode (which falsifies aMule's firewall
self-check and publish-tolerance zone — retired from evidence duty);
this one is a STOCK aMule on its normal, non-LAN-mode admission paths, so every
byte is genuine. rmule is the Kad Stimulus Node (publisher AND requester); the
aMule is the storer. rmule published a synthetic file's source (0x44), stock
aMule accepted and acked it (0x4B) after its own 0x53/0x58 firewall-UDP check,
rmule searched (0x34), and aMule answered with the 0x3B whose payload is
`result_0x3b_high_id.bin`. The 0x3B row is aMule-authored — aMule re-serialized
the entry from PARSED tags (CEntry::WriteTagListInc, not a byte echo), which
defeats the circularity trap. This capture proves the keyword
publisher+requester+merge (recipes 1+3) against a stock counterparty.
"""

[stimulus_disclosure]
