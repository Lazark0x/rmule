kad_stimulus_node = "rmule (this workspace), the publisher AND requester"
published_opcode = "0x44 KADEMLIA2_PUBLISH_SOURCE_REQ"
searched_opcode = "0x34 KADEMLIA2_SEARCH_SOURCE_REQ"
publisher_sent_no_source_ip = true # so any SOURCEIP in the answer is aMule-authored

[node_roles]
storer = "real STOCK aMule 2.3.3 (rmule/interop-amule:local, source pin 4e8f2b3c)"
publisher_and_requester = "rmule Kad Stimulus Node"
lan_mode = false # Config A: stock aMule, FilterLanIPs=1, non-LAN admission paths

[capture]
private_mesh = false
public_kad_used = false
topology = "Config A fake-public swarm, RFC 5737 203.0.113.0/24, Docker internal net"
network_is_internal = true # isolated swarm never emits a Kad datagram to the internet
captured_by = "rmule's own first-class datagram tap (rmule records what aMule sent it)"
