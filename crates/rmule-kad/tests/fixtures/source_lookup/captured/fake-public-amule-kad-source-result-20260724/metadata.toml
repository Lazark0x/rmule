amule_source_pin = "4e8f2b3c"
harness_verdict = "PASS (frames_total=32, amule_acked_publish_0x4b=true, amule_answered_search_0x3b=true)"

# The paired transcript. The request is rmule's stimulus (never evidence); the
# result is aMule's genuine answer (the evidence). Both are committed so the
# capture is reproducible end to end.
[request]
protocol = "0xE4"
opcode = "0x34" # KADEMLIA2_SEARCH_SOURCE_REQ, sent by rmule (the requester)
envelope_bytes_stripped = "0xE4 0x34"
# request_0x34.bin payload: [target 16][start u16 = 0][size u64 LE = 65536].
target_key = "B52D308E 5CA206B8 23FC8593 D26210F2"
file_size = 65536
authored_by = "rmule (stimulus, not evidence)"

[result]
protocol = "0xE4"
opcode = "0x3B"
# result_0x3b_high_id.bin is the payload AFTER the 0xE4 0x3B that KadEnvelope strips;
# datagram_0x3b_with_envelope.bin holds the full on-wire datagram.
envelope_bytes_stripped = "0xE4 0x3B"
sender_kad_id = "B52D308E 5CA206B8 23FC8593 D26210F2" # the storer's own Kad ID
target_key = "B52D308E 5CA206B8 23FC8593 D26210F2"    # = storer id (storer sits on the file key)
result_count = 1
payload_len_bytes = 84

# The publish ack — aMule's genuine 0x4B accepting rmule's 0x44 publish. This is
# the recipe-1 evidence (rmule publishes -> aMule stores).
[publish_ack]
protocol = "0xE4"
opcode = "0x4B" # KADEMLIA2_PUBLISH_RES
envelope_bytes_stripped = "0xE4 0x4B"
file = "publish_res_0x4b.bin"
payload_len_bytes = 15
authored_by = "aMule (the storer accepting the publish)"

