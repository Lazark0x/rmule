# peer-TCP only (ADR-0064 — aMule's own ban likewise never gates Kad inbound,
# as a capture confirmed), so proving the ban lands needs a follow-on eD2k TCP
# dial from the same IP getting refused, and CLIENTBANTIME expiry needs the 2 h
# wait. Both stay open, with this offender-trigger capture as the anchor.
