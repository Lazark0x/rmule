reason = """
Genuine KADEMLIA2_SEARCH_KEY_REQ (0x33) and KADEMLIA2_PUBLISH_KEY_REQ (0x43)
request bytes from a real STOCK aMule 2.3.3, captured on the Config-A fake-public
swarm (RFC 5737 documentation range 203.0.113.0/24, Docker `internal` net — never
public). This is the ROLE INVERSION of the flow-F source capture: here aMule is
the Kad PUBLISHER and REQUESTER and rmule is the STORER. rmule's KadID was pinned
to the keyword target (rmule's own keyword derivation, `keyword_target_kad_id`),
so it is the XOR-closest node and clears aMule's publish tolerance zone
(SEARCHTOLERANCE = 2^24) — drawing both the publish and the search onto it. These
are counterparty bytes (aMule-authored); rmule's bytes are never evidence.

This capture is the missing recipe-2 + recipe-4 evidence ADR-0062 names for the
keyword derivation fold + search-tree grammar codec row and the keyword_store
+ storer row. rmule consumed every datagram — its keyword store emitted
KeywordSearchServed twice (plain + restrictive) and KeywordPublishServed once
(indexed = 1) — so the storer's decode + serve path faced real aMule bytes and
answered.

The single most load-bearing fact: the keyword ID aMule put on the wire in BOTH
its 0x33 and its 0x43 equals rmule's own keyword_id("rmulekadkeyword") EXACTLY
(e7b64ea7de34bca052ce0690991bc53b). aMule's GetKeywordHash and rmule's fold
(MD4 over the lowercased UTF-8 token, per-32-bit-word wire swap) are therefore
byte-identical — the ADR-0062 recipe-2 "keyword-ID derivation fold (byte parity)"
claim, now CAPTURE-PROVEN rather than only asserted. (A divergent fold would have
routed aMule's publish/search away from rmule and this capture would be empty.)
"""

