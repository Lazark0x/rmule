authored_by = "aMule (the requester)"

# Recipe 4 — aMule searches (two-word), rmule serves. Restrictive-tree 0x33: the
# tree-decode vector ADR-0062 recipe 4 names. Query "rmulekadkeyword parityprobe":
# target is the first token; the tree carries the residual term "parityprobe".
[search_tree]
file = "search_key_req_tree_0x33.bin"
