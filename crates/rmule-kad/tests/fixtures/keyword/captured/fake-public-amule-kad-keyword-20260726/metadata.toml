# Each .bin is the FULL on-wire datagram (the 0xE4 protocol byte + opcode + the
# payload KadEnvelope strips), so a decoder can `decode_exact` it directly.

# Recipe 4 — aMule searches (plain), rmule serves. Baseline 0x33: no tree.
[search_plain]
