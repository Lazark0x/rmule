# Stock aMule 2.3.3's OP_EMULEINFO in its OS-info form (protocol byte 0xFF),
# sent aMule-to-aMule on the Kad bench. Cut byte for byte out of the requester's
# pcap; nothing re-encoded.
#
# Evidence FOR: the only OP_EMULEINFO any archive holds. Its first byte is
# aMule's CURRENT_VERSION_SHORT (0x47, include/common/ClientVersion.h:39), its
# second the OS-info protocol 0xFF, its one tag ET_OS_INFO (0x94) written in the
# old length-prefixed-name format: 02 | 0100 94 | 0500 "Linux". aMule sends this
# form only to a peer whose hello carries CT_EMULECOMPAT_OPTIONS with the OS-info
# bit (ClientTCPSocket.cpp:357-361) — another aMule; rmule never sends that tag,
# so no aMule sends rmule this frame. Read, it must leave identification alone.
# No archive holds the legacy form (protocol 0x01): no bench client is older
# than eMule 0.42.

