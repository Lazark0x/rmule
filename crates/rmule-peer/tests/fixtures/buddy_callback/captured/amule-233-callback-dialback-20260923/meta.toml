# ADR-0061 route 4 against a live aMule, end to end (a `PASS`):
# a High-ID rmule downloader handed only the ed2k link found the
# firewalled aMule's type-3 buddy row over Kad, sent the plaintext `0x52` to
# the rmule buddy the row named, the buddy relayed `OP_CALLBACK` over the link
# aMule held, and aMule dialed the downloader back and served the file
# byte-equal. The same run's walk fold-in is here too: a Callback Walk's
# obfuscated `0x52` delivered to aMule, and aMule's relay of it. Every frame
# is off a tcpdump on the bench; nothing is fabricated (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# * `dial_back_hello_0x01.bin` (aMule-authored) is the answer to
#   `callback_0x99.bin` (rmule's relay): aMule logged `Remote Client:
#   OP_CALLBACK from 203.0.113.3` then `Trying to connect to 203.0.113.7:4662`
#   in the same second, and its SYN left 0.66 ms after the relay. Its User
#   Hash is `publish_source_req_0x44.bin`'s source ID in Kad word order — the
#   key the download's Dial-Back Claim matched it by.
# * `callback_0x99.bin` names the downloader host-order (`07 71 00 cb`). Until
#   `b6158049` rmule wrote the octets in order and aMule dialed the mirrored
#   address (runs `1790151298`, `1790152605`: relay ACKed, no dial-back).
# * `walk_relay_0x99.bin` (aMule-authored) is aMule's relay of a walk-sent
#   `0x52` the walker obfuscated under aMule's Kad ID: aMule's tap held no
#   plaintext `0x52` from the walker, aMule logged `KadCallbackReq from
#   203.0.113.8:4672` and `Local Client: OP_CALLBACK to 203.0.113.8`.

