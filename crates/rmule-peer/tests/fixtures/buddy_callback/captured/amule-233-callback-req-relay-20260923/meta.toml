# rmule's buddy relaying a **stock aMule's own** `KADEMLIA_CALLBACK_REQ`
# (`0x52`) as `OP_CALLBACK` (`0x99`) over the link a firewalled aMule held —
# interop (flow M `kad-core-buddy --publish-source --amule-requester`).
# Both frames are bytes off a tcpdump on the buddy's
# own netns; nothing is fabricated (ADR-0045).
#
# ## What this fixture is evidence FOR
#
# `amule-233-callback-relay-20260923` captured rmule's relay of an rmule-authored `0x52`. Here the
# downloader is a second stock aMule 2.3.3 handed only the ed2k link, so the
# request the relay answers is aMule's (`BaseClient.cpp:2133-2141` at kno
# `ab483654`; decoded in `rmule-kad/tests/kad/callback_req_capture.rs`, the
# same 36 bytes promoted there as `amule-233-callback-req-20260923`):
#
# * `rmule_callback_0x99.bin` repeats the `0x52`'s `buddyID` and `fileID`
#   byte for byte — aMule's own `ProcessCallbackRequest` is a
#   `ReadUInt128`/`WriteUInt128` pass-through too — and names the requester
#   `07 71 00 cb` (203.0.113.7, host-order, octets reversed: the host-order fix).
# * The firewalled aMule consumed it: `Remote Client: OP_CALLBACK from
#   203.0.113.3`, `Trying to connect to 203.0.113.7:4662`, its SYN 0.71 ms
#   after the relay, and 4194304 bytes landed in the requester's incoming
#   directory byte-equal to the synthetic file.

