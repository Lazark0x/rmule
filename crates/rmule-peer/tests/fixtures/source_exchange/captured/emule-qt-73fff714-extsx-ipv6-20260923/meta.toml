# ExtSX source answer — emule-qt's own OP_ANSWERSOURCES2 carrying an IPv6
# source in the CT_MOD_IP_V6 tag (ADR-0087), drawn over IPv6 on the IPv6
# dual-stack bench by `ipv6-extsx`.
#
# The bytes are emule-qt's. The source it describes is an rmule body the flow
# queued on emule-qt's shared file — its hello named 3fff:ed2:1::7 — so the
# record is emule-qt's statement about a peer it was told of, the Stimulus
# that told it recorded beside. Only counterparty bytes are evidence
# (ADR-0045); ADR-0087's evidence table names emule-qt `73fff714` as one of
# the two ExtSX oracles. The same 68 bytes sit whole in packet 63 of the
# run's tap (`ipv6/ipv6-extsx/tap-wan.pcap`, emule-qt's own attachment,
# 3fff:ed2:1::3.4662 > 3fff:ed2:1::6.59550).

