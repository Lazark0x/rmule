why     = "KnownFile::createSrcInfoPacket answers a complete shared file out of m_uploadingClients (Uploading/OnUploadQueue); the ExtSX path keeps a Low-ID client whose hello latched a public IPv6 (KnownFile.cpp:849, UpDownClient.cpp:1007) and writes it as CT_MOD_IP_V6 (KnownFile.cpp:937); USERHASH rides because the asker claimed SKIPTAGS; no CONOPTS (the queued body advertised no crypt, so the byte is zero and omitted); no SERVERIP/SERVERTCP (no server session)"
