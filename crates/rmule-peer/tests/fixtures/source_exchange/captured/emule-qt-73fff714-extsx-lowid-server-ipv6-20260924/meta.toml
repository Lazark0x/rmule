# ExtSX source answer — emule-qt's own OP_ANSWERSOURCES2 describing a Low-ID
# requester that named its IPv6 and its server (ADR-0087 / ADR-0061 rung 0),
# drawn by `ipv6-download-rung0`.
#
# The bytes are emule-qt's. The source it describes is an rmule body
# (`ipv6 hold-slot`) queued on emule-qt's shared file over IPv6 from
# 3fff:ed2:1::7 with Low ID 0x00AAAA00 and `--connected-server` naming
# ed2ksrv (45.55.200.5:4661). emule-qt writes the id as `htonl(userIDHybrid)`
# (`KnownFile.cpp:870`) — 0x00AAAA00 is its own byte reverse, so it reads back
# as the same Low ID — and puts the server beside it as CT_EMULE_SERVERIP /
# CT_EMULE_SERVERTCP, the IPv6 as CT_MOD_IP_V6. That is the one record shape
# that reaches rmule's download as a Low-ID candidate *with* its IPv6 half.
# Only counterparty bytes are evidence (ADR-0045). The same 78 bytes sit
# whole on emule-qt's tap (`ipv6/ipv6-download-rung0/tap-wan.pcap`,
# 45.55.200.3:4662 -> the downloader) in runs 1790223453, 1790223875 and the
# earlier-image control 1790224289 — byte-identical in all three.

