driver       = "rmule-tools ipv6 hold-slot --connected-server + ed2k download start --serve, image rmule/interop-rmule-tools"
scenario     = "rmule-interop-harness ipv6-dialect ipv6-download-rung0 (acceptance ipv6_download_rung0)"
