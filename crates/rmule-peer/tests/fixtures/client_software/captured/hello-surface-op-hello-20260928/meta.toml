# The OP_HELLO each bench client sends rmule when it dials it: stock aMule
# 2.3.3, kno's aMule and emule-qt, each downloading a file a serving rmule
# shared, each frame the first OP_HELLO on the client's own tap toward that
# rmule. Cut by the flow from the client's pcap and copied byte for byte from
# the run dir; nothing re-encoded.
#
# Evidence FOR: the dialing-side hello of all three clients, beside the
# OP_HELLOANSWER each wrote earlier (client_software/, ipv6_dialect/). The same
# run records their reaction to rmule's hello ending in CT_MOD_VERSION
# "rmule 0.1.0": Secure User Identification both ways, a part each way, no
# OP_EMULEINFO (peer-hello-surface-verdict.toml, OBSERVED, 32 of 35 held).

[provenance]
archive      = "ipv6/peer-hello-surface/op-hello-<client>.bin in the run's output directory"
run          = "1790611695 (2026-09-28 16:08 UTC)"
scenario     = "rmule-interop-harness ipv6-dialect peer-hello-surface"
driver       = "rmule/interop-rmule-tools, built from commit 8400eba0"
transform    = "none: the whole eD2k TCP frame, as the flow cut it from the client's TCP stream"

