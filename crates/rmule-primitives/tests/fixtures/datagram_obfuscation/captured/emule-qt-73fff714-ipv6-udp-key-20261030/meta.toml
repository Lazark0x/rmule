# One obfuscated client-UDP datagram written by emule-qt `73fff714` over IPv6,
# captured on the IPv6 dialect bench during interop flow
# `ipv6-dialect ipv6-udp-key`. `keyed_file_not_found.bin` is the datagram the
# driver's socket received, byte for byte (`cmp` against the run's
# `udpkey-emuleqt-keyed-capture/obfuscated_reply.bin`); nothing is fabricated
# (ADR-0045).
#
# ## What this datagram is evidence FOR
#
# ADR-0087's 35-byte client-UDP key on the **inbound** side, off the dialect's
# own author. rmule's `decrypt_datagram_client` opens it with the receiver's
# user hash and the sender's IPv6 address as the socket reported it, and
# recovers `OP_FILENOTFOUND` (`c5 92`). Until this run the row held only the
# outbound half: emule-qt answered an unattributed reask in the clear.
#
# ## How it was drawn
#
# `UploadQueue.cpp` keys a file-not-found reply only to a client it holds
# (`clientList->findByEndpoint_UDP`, then `shouldReceiveCryptUDPPackets()`,
# which needs the crypt bit and a Kad version of at least 8). The driver said
# hello over IPv6 first and held that link: its hello named the driver's UDP
# port as both UDP ports, which is what sets the Kad version nibble, and
# claimed the crypt layer. Its obfuscated `OP_REASKFILEPING` then named a file
# emule-qt does not share.
#
# Tier: **`captured`**, one implementation. kno's fork refuses the row by design
# (the flow's `amule-kno-does-not-decrypt-a-native-v6-datagram` claim), so
# emule-qt stays this key's one IPv6 oracle.

