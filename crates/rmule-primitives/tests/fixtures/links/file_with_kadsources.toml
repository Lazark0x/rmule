The link eMule writes for a firewalled node with a buddy (emule-qt 73fff71
srchybrid/Emule.cpp:825: `…|/|kadsources,<user hash>:<kad id>|/`). No reference reads
a source out of it (aMule skips it; eMule's scan finds no dialable entry), so it is
accepted and nothing taken.
"""
