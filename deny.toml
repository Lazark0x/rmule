# cargo-deny policy for distributing rmule as a GPL-3.0-or-later program.
# Run: `cargo deny check` (root workspace) and
#      `cargo deny --manifest-path tools/ed2ksrv-differ/Cargo.toml check`.

[graph]
all-features = true

[licenses]
# Every licence here may be combined into a GPL-3.0-or-later binary.
# Deliberately absent: GPL-2.0-only, LGPL-2.0-only, SSPL, BUSL, any proprietary licence.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OpenSSL",
    "BSL-1.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# webpki-roots ships Mozilla's CA bundle as data under CDLA-Permissive-2.0
# (a permissive data licence that asks only for the licence text to travel with
# the data); allowed for that one crate rather than workspace-wide.
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# Workspace crates are unpublished GPL-3.0-or-later; they are still checked.
ignore = false

[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0293", reason = "ringbuf is pinned to 0.4 by librqbit-utp and its only ring holds u8 elements, whose drop cannot panic." },
    { id = "RUSTSEC-2023-0071", reason = "The rsa crate is only used to sign, verify and generate keys, never to decrypt, and no patched release exists." },
    # The four below are in tools/ed2ksrv-differ only. Its oracle, ed2k-server,
    # is pinned to an exact upstream commit and itself pins `bytes =1.6`,
    # `tracing-subscriber =0.3.18` and `flate2 =1.0.30`, so a lockfile update
    # cannot move them; re-pinning the oracle would void the fixtures captured
    # against it. The differ is a test tool that is never built into a release.
    { id = "RUSTSEC-2026-0007", reason = "bytes 1.6.1, held by the pinned oracle; the differ only decodes captured fixtures and talks to a loopback oracle." },
    { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber 0.3.18, held by the pinned oracle; the differ's log goes to the developer's own terminal." },
    { id = "RUSTSEC-2025-0056", reason = "adler, an unmaintained checksum crate reached through the oracle's flate2 pin; no advisory describes an exploitable flaw." },
    { id = "RUSTSEC-2024-0436", reason = "paste, an unmaintained proc-macro reached through the oracle's jemalloc bindings; it runs at build time only." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# tools/ed2ksrv-differ pins its oracle (MIT) at an exact upstream commit; that
# crate is `publish = false`, so a git source does not block anything.
allow-git = ["https://github.com/andrey23127/ed2k-server"]
