# rmule's 111-byte OP_ANSWERSOURCES2 (0xC5/0x84) rode in one 204-byte segment
# behind its signature packet (0x86) and 0x93, at stream offset 323. The run's
# verdict read the two claims that wait for it as absent because its filter
# only matched a frame at the head of a segment.

