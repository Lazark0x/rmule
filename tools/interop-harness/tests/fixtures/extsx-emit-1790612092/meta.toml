# One direction of one peer-TCP link, as the bench's tap recorded it: rmule's
# segments to emule-qt in bench run `1790612092` (flow `ipv6-extsx-emit`).
# A classic pcap (EN10MB, little-endian, microseconds), stored as `.bin`
# because full captures are never committed; this is the minimal slice the
# frame-walk test needs. Nothing was edited: tcpdump selected the segments by
# header only.
