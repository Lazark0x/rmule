; Minimal Lugdunum eserver config for the interop harness. Without a donkey.ini
; the eserver runs configless and leaves its UDP port uninitialised (-1), logging
; "Could not bind UDP socket to port -1"; that degraded state intermittently drops
; client logins once more than one client is connected. Setting `ports` binds both
; the TCP and UDP listeners on 4661 and keeps the server stable for the
; multi-client Low-ID callback scenario (ADR-0039). Limits are generous: a local
; interop run never approaches them.
[server]
name=rmule-interop
welcome=rmule interop test server

[parameters]
ports=4661
maxClients=100000
maxClientsPerIP=50
lowIDClients=50000
maxBannedIP=20000
thisIP=
