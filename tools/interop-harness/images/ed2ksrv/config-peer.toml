# Bench config for the SECOND `ed2k-server` instance — the gossip peer that
# makes `OP_SERVERLIST 0x32` non-empty.
#
# Identical to `config.toml` except for the two keys that make it a distinct,
# gossiping counterparty:
#
#   * `this_ip`      — its own fake-public address, one above the first instance.
#   * `seed_servers` — the first instance, which is this process's ONLY source of
#                      egress (audit §6). Naming exactly one in-bench address is
#                      what keeps the pair hermetic: there is no public peer for
#                      a captured server list to be contaminated with.
#
# Bind-mounted over the image's baked upstream config:
#   -v .../images/ed2ksrv/config-peer.toml:/etc/ed2k-server/config.toml:ro
#
# The gossip round trip is one-directional to start with — this instance seeds
# toward the first — so it is THIS instance whose `verified_sockets` fills, and
# therefore this instance a client must ask for a non-empty `0x32`.

[server]
name = "rmule interop bench peer"
desc = "ed2k-server @ eacf7f1 gossip peer on the fake-public /24"
public = false
version_major = 17
version_minor = 15
this_ip = "203.0.113.21"
seed_servers = ["203.0.113.20:4661"]

[network]
tcp_port = 4661
listen_ip = "0.0.0.0"
listen_backlog = 256
max_frame_size = 1_000_000
login_timeout_ms = 4000
support_crypt = true

[limits]
max_clients = 1000
soft_limit_files = 1000
hard_limit_files = 4000
max_clients_per_ip = 10
max_string_size = 250
ping_delay_seconds = 300

[content_filter]
hash_blocklists = []
publisher_attempt_disconnect_threshold = 3
publisher_blacklist_seconds = 86400

[welcome]
messages = ["rmule interop bench gossip peer"]

[log]
level = "debug"
connection_trace = true
worker_threads = 1

[storage]
ipfilter_path = ""
country_db_path = ""

[admin]
enabled = true
port = 8080
